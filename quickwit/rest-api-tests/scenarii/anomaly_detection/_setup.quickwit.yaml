# Delete possibly remaining index
method: DELETE
endpoint: indexes/anomalies
status_code: null
---
method: POST
endpoint: indexes/
json:
  version: "0.7"
  index_id: anomalies
  doc_mapping:
    timestamp_field: ts
    field_mappings:
      - name: ts
        type: datetime
        fast: true
      - name: latency
        type: u64
        fast: true
---
# 11 minutes of regular traffic, the last one with a latency spike,
# followed by a silent minute.
method: POST
endpoint: anomalies/ingest
params:
  commit: force
ndjson:
  - {"ts": 1699999980, "latency": 10}
