[package]
name = "quickwit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# This crate is deliberately detached from the main quickwit workspace: cargo-fuzz
# builds with sanitizers and needs `debug = true` on the release profile, and
# neither should leak into the regular quickwit build.
[workspace]

[profile.release]
debug = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

quickwit-common = { path = "../quickwit-common" }
quickwit-config = { path = "../quickwit-config" }
quickwit-doc-mapper = { path = "../quickwit-doc-mapper" }
quickwit-opentelemetry = { path = "../quickwit-opentelemetry" }
quickwit-query = { path = "../quickwit-query" }

[[bin]]
name = "search_query_string"
path = "fuzz_targets/search_query_string.rs"
test = false
doc = false
bench = false

[[bin]]
name = "elastic_query_dsl"
path = "fuzz_targets/elastic_query_dsl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ingest_document"
path = "fuzz_targets/ingest_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index_config"
path = "fuzz_targets/index_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "otlp_logs_json"
path = "fuzz_targets/otlp_logs_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "otlp_logs_protobuf"
path = "fuzz_targets/otlp_logs_protobuf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "otlp_traces_json"
path = "fuzz_targets/otlp_traces_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "otlp_traces_protobuf"
path = "fuzz_targets/otlp_traces_protobuf.rs"
test = false
doc = false
bench = false
